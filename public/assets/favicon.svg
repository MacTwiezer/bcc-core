<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OpsFlow">
    <!-- OpsFlow sekme ikonu. Eskiden burada assets/logo.png'nin base64 gömülü
         hâli vardı: içinde "bcc" harfleri piksel olarak basılı bir bitmap, yani
         marka değişince güncellenemeyen bir varlık. Artık vektör: rozet +
         src/partials/brand_logo.php'deki kelime işaretiyle AYNI "akış" glifi.
         Renk sabit (#2d7ff9) — favicon tema değişkenlerine erişemez, tarayıcı
         sekmesi sayfanın CSS'ini uygulamaz. -->
    <rect width="32" height="32" rx="8" fill="#2d7ff9"/>
    <g fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round">
        <path d="M9 11h10a4 4 0 0 1 0 8H9"/>
        <path d="M9 24h13"/>
    </g>
</svg>
